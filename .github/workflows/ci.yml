# Test the extension and build its package for every push to main and every
# pull request, on the pinned Node.js 24 release (.node-version); VS Code 1.125
# (engines.vscode) and later run extensions on Node.js 24 too. The job "test"
# installs the locked development tools without install scripts, checks the
# types and the code (ESLint), runs the unit tests, the screenshot tests, the
# tests in a real VS Code (stable) and the tests against real Node.js programs,
# which run with the TypeScript compiler of that VS Code, and packages the VSIX
# with vsce, which also validates the manifest and the README. The VSIX and the
# screenshots stay workflow artifacts for inspection.
# This workflow publishes nothing: the release workflow calls it for the commit
# of a version and publishes the VSIX of that call. A change of this file
# changes the release process: its pull request needs a dry run (rule 4). The
# workflow "VS Code versions" calls it once per week with another VS Code
# version; such a call runs only the type check, ESLint, the unit tests, the
# tests in VS Code and the package.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow calls this workflow for the commit of a version,
  # because its push of that commit starts no workflow.
  workflow_call:
    inputs:
      ref:
        description: The commit to test and package; empty for the commit of the event.
        type: string
        required: false
        default: ''
      vscode-version:
        description: The VS Code version of the tests in VS Code, "insiders" or a version such as 1.125.0; empty for stable. When set, the screenshot tests and the tests against Node.js programs do not run.
        type: string
        required: false
        default: ''

permissions:
  # Checkout needs repository reads; the checks get no write scope.
  contents: read

env:
  # The two calls of the workflow "VS Code versions" in one workflow run keep their artifacts apart. Empty for every
  # other run, so the release workflow finds the artifact "vsix".
  ARTIFACT_SUFFIX: ${{ inputs.vscode-version && format('-vscode-{0}', inputs.vscode-version) || '' }}

jobs:
  test:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install the locked development tools without install scripts
        run: npm ci --ignore-scripts

      - name: Check the types
        run: npm run typecheck

      - name: Check the code with ESLint
        run: npm run lint

      - name: Run the unit tests
        run: npm test

      - name: Run the screenshot tests
        if: ${{ !inputs.vscode-version }}
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:render

      - name: Keep the screenshots
        if: ${{ always() && !inputs.vscode-version }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: test/render/output/*.png
          if-no-files-found: ignore

      # .vscode-test.mjs takes the VS Code version from VSCODE_TEST_VERSION; empty gives stable.
      - name: Run the tests in VS Code
        env:
          VSCODE_TEST_VERSION: ${{ inputs.vscode-version }}
        run: xvfb-run -a npm run test:vscode

      # After the tests in VS Code: Node.js runs the programs with the TypeScript compiler of the VS Code in
      # .vscode-test/, as Mindbug runs them.
      - name: Run the tests against Node.js programs
        if: ${{ !inputs.vscode-version }}
        run: npm run test:node

      - name: Build the VSIX package
        run: npm run package

      - name: Keep the VSIX package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix${{ env.ARTIFACT_SUFFIX }}
          path: '*.vsix'
          if-no-files-found: error
