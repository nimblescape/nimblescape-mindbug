# Dependabot: weekly updates of the development tools, in one group, and of the
# pinned actions of the workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
    ignore:
      # @types/vscode stays at the version of engines.vscode, @types/node at Node.js 24, the runtime of VS Code
      # 1.125.
      - dependency-name: '@types/vscode'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript stays at 6.0.3 in every nimblescape extension: typescript-eslint supports TypeScript only up to 6.0,
      # and TypeScript 7 has no language service for the plugin of nimblescape TypeScript. A move to another version of
      # TypeScript is one decision for all extensions together.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major', 'version-update:semver-minor', 'version-update:semver-patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
